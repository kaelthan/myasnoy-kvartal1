<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ — Мясной Квартал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header>
      <a href="index.html" class="logo">Мясной<br>Квартал</a>
      <div class="auth">
        <a href="register.html">Вход</a>
        <a href="register.html">регистрация</a>
      </div>
      <a href="cart.html" class="cart">
        <svg viewBox="0 0 60 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 4 h8 l6 26 h32 l7 -19 H14"/>
          <circle cx="21" cy="40" r="4"/>
          <circle cx="42" cy="40" r="4"/>
        </svg>
      </a>
    </header>

    <h2 class="center">заказ</h2>

    <form class="form-page" style="background:rgba(0,0,0,0.15); padding:20px; border-radius:10px;">
      <input type="text" placeholder="Имя" required>
      <input type="tel" placeholder="Телефон" required>

      <div class="radio-row">
        <label><input type="radio" name="type" checked> Доставка</label><br>
        <label><input type="radio" name="type"> Самовывоз</label>
      </div>

      <input type="text" placeholder="Адрес доставки">

      <div style="display:flex; gap:10px;">
        <input type="date" style="flex:1;">
        <input type="time" style="flex:1;">
      </div>

      <button type="submit" class="btn-primary">Оформить</button>
    </form>

    <footer>
      Адрес - Репина 523
    </footer>

  </div>
</body>
</html>
