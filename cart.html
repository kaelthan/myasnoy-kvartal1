<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — Мясной Квартал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header>
      <nav class="top-nav">
        <a href="index.html">главная</a>
        <a href="burgers.html">меню</a>
      </nav>
      <a href="index.html" class="logo">Мясной<br>Квартал</a>
      <nav class="top-nav">
        <a href="contacts.html">контакты</a>
      </nav>
      <div class="auth">
        <a href="register.html">Вход</a>
        <a href="register.html">регистрация</a>
      </div>
      <a href="cart.html" class="cart">
        <svg viewBox="0 0 60 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 4 h8 l6 26 h32 l7 -19 H14"/>
          <circle cx="21" cy="40" r="4"/>
          <circle cx="42" cy="40" r="4"/>
        </svg>
      </a>
    </header>

    <div class="cart-page" id="cart">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <strong>Корзина</strong>
        <button onclick="clearCart()" style="background:none;border:1px solid #fff;color:#fff;border-radius:6px;cursor:pointer;padding:2px 10px;">✕</button>
      </div>

      <div class="cart-item">
        <img src="https://avatars.mds.yandex.net/i?id=2a6f22dbf815cde2fe9a9256d46dc2ffec8c5204-9154408-images-thumbs&n=13" alt="Мясная бомба">
        <div class="ci-info">
          <div class="ci-name">Мясная бомба</div>
          <div class="ci-price">689Р</div>
        </div>
        <div class="qty">
          <button onclick="changeQty(0,-1)">−</button>
          <span id="qty0">1</span>
          <button onclick="changeQty(0,1)">+</button>
        </div>
      </div>

      <div class="cart-item">
        <img src="https://avatars.mds.yandex.net/i?id=4dec0f60f7b0f733e863197777aa486f46ce3340-12498917-images-thumbs&n=13" alt="Супер сырный">
        <div class="ci-info">
          <div class="ci-name">Супер сырный</div>
          <div class="ci-price">550Р</div>
        </div>
        <div class="qty">
          <button onclick="changeQty(1,-1)">−</button>
          <span id="qty1">1</span>
          <button onclick="changeQty(1,1)">+</button>
        </div>
      </div>

      <div class="cart-item">
        <img src="https://avatars.mds.yandex.net/i?id=4a84eb59478bd8503f8998081bf8e32d19672421-3562367-images-thumbs&n=13" alt="Свиные ребра">
        <div class="ci-info">
          <div class="ci-name">Свиные ребра</div>
          <div class="ci-price">560Р</div>
        </div>
        <div class="qty">
          <button onclick="changeQty(2,-1)">−</button>
          <span id="qty2">1</span>
          <button onclick="changeQty(2,1)">+</button>
        </div>
      </div>

      <div class="cart-total">
        Итог: <span id="total">1799Р</span>
      </div>

      <a href="order.html" class="btn-primary" style="text-decoration:none; text-align:center;">Оформить заказ</a>
    </div>

    <footer>
      Адрес - Репина 52
    </footer>

  </div>

  <script>
    const prices = [689, 550, 560];
    const qty = [1, 1, 1];

    function changeQty(i, delta) {
      qty[i] = Math.max(0, qty[i] + delta);
      document.getElementById('qty' + i).textContent = qty[i];
      updateTotal();
    }

    function updateTotal() {
      const sum = prices.reduce((acc, p, i) => acc + p * qty[i], 0);
      document.getElementById('total').textContent = sum + 'Р';
    }

    function clearCart() {
      for (let i = 0; i < qty.length; i++) qty[i] = 0;
      for (let i = 0; i < qty.length; i++)
        document.getElementById('qty' + i).textContent = 0;
      updateTotal();
    }
  </script>
</body>
</html>
